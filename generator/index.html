<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.amo Studio</title>
<style>
    :root {
        color-scheme: dark;
        --bg: #050505; --panel: #0a0a0a; --line: #1c1c1c;
        --txt: #b6b6b6; --dim: #777; --accent: #7ec97e; --err: #c66; --warn: #cc8;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; background: var(--bg); color: var(--txt);
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
        display: grid; grid-template-columns: 300px 1fr 380px; height: 100vh;
    }
    .pane { overflow-y: auto; padding: 12px; }
    #form-pane { border-right: 1px solid var(--line); }
    #source-pane { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
    h1 { font-size: 13px; color: var(--accent); margin: 2px 0 10px; }
    h2 { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .09em;
         border-bottom: 1px solid var(--line); padding-bottom: 3px; margin: 16px 0 8px; }
    label { display: block; color: var(--dim); margin-top: 7px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > label { flex: 1; }
    input, select, textarea {
        width: 100%; background: #101010; color: #ccc; border: 1px solid #242424;
        padding: 4px 6px; font: inherit; border-radius: 3px; margin-top: 2px;
    }
    input[type="color"] { padding: 1px; height: 26px; }
    input[type="range"] { padding: 0; }
    textarea { resize: vertical; font-size: 11px; }
    textarea.source { height: 100%; min-height: 200px; font-size: 11px; white-space: pre; }
    button {
        background: #14291a; color: #9c9; border: 1px solid #234; padding: 5px 11px;
        font: inherit; cursor: pointer; border-radius: 3px; margin-top: 8px;
    }
    button:hover { background: #1b3d22; }
    button.secondary { background: #141414; color: #999; }
    button.danger { background: #2a1212; color: #c88; }

    #preview-pane { display: flex; flex-direction: column; background: #000; }
    #shell { flex: 1; position: relative; background: #000; min-height: 240px; }
    #preview-canvas { width: 100%; height: 100%; display: block; }
    #transport {
        display: flex; gap: 10px; align-items: center; padding: 8px 12px;
        border-top: 1px solid var(--line); font-size: 11px; color: var(--dim);
    }
    #transport input[type="range"] { flex: 1; }
    #status { padding: 6px 14px; font-size: 11px; white-space: pre-wrap; min-height: 34px;
              border-top: 1px solid var(--line); color: var(--dim); }
    .err { color: var(--err) !important; }
    .warn { color: var(--warn) !important; }
    .ok { color: var(--accent) !important; }
    #gallery { display: flex; flex-wrap: wrap; gap: 5px; }
    #gallery button { margin: 0; padding: 3px 8px; font-size: 11px; }
    .hint { color: #555; font-size: 10px; margin-top: 3px; }
    select.preset-sel { width: auto; }
</style>
</head>
<body>

<div id="form-pane" class="pane">
    <h1>.amo studio</h1>

    <h2>Meta</h2>
    <label>Name <input id="f-name" value="my scene"></label>
    <label>Author <input id="f-author" value=""></label>

    <h2>Display (art direction)</h2>
    <label>Gamma <input id="f-gamma" type="number" min="0.5" max="4" step="0.05" value="1.7"></label>
    <label>Spill <input id="f-spill" type="number" min="0" max="0.6" step="0.01" value="0.40"></label>
    <div class="row">
        <label>Brightness <input id="f-active" type="number" min="0" max="1" step="0.05" value="1"></label>
        <label>Off-pixel <input id="f-inactive" type="number" min="0" max="0.5" step="0.005" value="0.035"></label>
    </div>
    <div class="row">
        <label>Bloom <input id="f-bloomI" type="number" min="0" max="1" step="0.05" value="0.25"></label>
        <label>Floor <input id="f-bloomT" type="number" min="0" max="1" step="0.01" value="0.45"></label>
        <label>Radius <input id="f-bloomR" type="number" min="2" max="40" step="1" value="14"></label>
    </div>

    <h2>Quality</h2>
    <div class="row">
        <label>FPS <input id="f-fps" type="number" min="1" max="60" step="1" value="30"></label>
        <label>Supersample
            <select id="f-ss"><option value="">auto</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </label>
    </div>
    <div class="row">
        <label>Logical W <input id="f-lw" type="number" min="64" max="1280" placeholder="auto"></label>
        <label>H <input id="f-lh" type="number" min="64" max="1280" placeholder="auto"></label>
    </div>

    <h2>Timeline</h2>
    <div class="row">
        <label>Duration (s) <input id="f-duration" type="number" min="0" step="0.5" value="8"></label>
        <label>Loop <select id="f-loop"><option value="true">yes</option><option value="false">no</option></select></label>
    </div>

    <h2>Scene</h2>
    <label>Type
        <select id="f-type"></select>
    </label>
    <div id="scene-fields"></div>

    <h2>Motion preset</h2>
    <div class="row">
        <select id="preset-select" class="preset-sel"></select>
        <button id="btn-preset" style="margin:0">Apply</button>
    </div>
    <div id="preset-params"></div>
    <div class="hint">Presets expand to plain expressions in the exported file.</div>

    <h2>Actions</h2>
    <div class="row">
        <button id="btn-export">Export .amo</button>
        <button id="btn-import" class="secondary">Import</button>
    </div>
    <input type="file" id="file-import" accept=".amo,.json" style="display:none">

    <h2>Gallery</h2>
    <div id="gallery"></div>
</div>

<div id="preview-pane">
    <div id="shell"><canvas id="preview-canvas"></canvas></div>
    <div id="transport">
        <button id="btn-play" style="margin:0">&#9654;</button>
        <input id="scrubber" type="range" min="0" max="8" step="0.05" value="0">
        <span id="t-label">0.0s / 8s</span>
    </div>
    <div id="status">booting…</div>
</div>

<div id="source-pane" class="pane">
    <h2>.amo source</h2>
    <textarea id="source" class="source" spellcheck="false"></textarea>
    <div class="hint">Edits re-parse automatically (250 ms). Invalid JSON shows an error without touching the preview.</div>
</div>

<script src="../src/gifuct.js"></script>
<script src="../src/engine/util.js"></script>
<script src="../src/engine/config.js"></script>
<script src="../src/engine/frame-buffer.js"></script>
<script src="../src/engine/diamond-pentile-geometry.js"></script>
<script src="../src/engine/amoled-renderer.js"></script>
<script src="../src/engine/amoled-gpu-renderer.js"></script>
<script src="../src/media-loader.js"></script>
<script type="module" src="./studio.js"></script>
</body>
</html>
